 return[P(61,Lw,14.4),P(55.1,3.05,14.4),P(49.2,H,14.4),P(44,H,14.4),P(38,H,14.4),P(33.2,H,14.4),

 slab(44.5,64.6,.2,16.3);slab(0,31.4,18.4,43.7);
 for(const[x,z]of[[50,5],[58,5],[54,11],[8,24],[20,24],[8,35],[20,35]]){const v=new THREE.Group();v.position.set(x,9,z);v.add(cy(.32,.38,.9,0x9aa3ab,0,.45,0,0,.85,14));
  const sp=new THREE.Group();sp.position.y=1.15;const dm=new THREE.Mesh(new THREE.SphereGeometry(.52,14,8),mat(0xcfd6dc,.8,.3));dm.scale.y=.85;sp.add(dm);
  for(let i=0;i<12;i++){const fn=bx(.04,.7,.3,0xaeb8c2,0,0,0,.7,.35),a=i*Math.PI/6;fn.position.set(Math.cos(a)*.5,0,Math.sin(a)*.5);fn.rotation.y=-a+.5;sp.add(fn)}

function pdsTick(){if(!PD.on||!PD.tro)return;const o=PD.o3,L=PD.L,cnt=PD.cnt,sp=L/cnt,v=(PD.speed*performance.now()/1000)%L,P=PD.p,Q=PD.q;

 [[59.5,15.9,0,-1],[57,15.9,0,-1],[63.4,11.6,-1,0],[63.4,13.2,-1,0],[52,7,0,1],[56,4,1,0],[12,18.9,0,1],[22,18.9,0,1],[8,38.4,0,1],[18,38.4,0,1]].forEach((w,i)=>{const g=fig(i);g.position.set(w[0],0,w[1]);g.rotation.y=Math.atan2(w[2],w[3]);sc.add(g)})}

/* ===== selection (tap a machine or zone) ===== */

 if(s&&s.k=='m'){const m=MID.get(s.id),d=dim(m);selRing.visible=true;selRing.position.set(m.x,.12,m.z);selRing.scale.setScalar(isLong(m)?Math.max(3.2,m.mw*1.2+1.5):Math.max(d[0],d[1])*m.s*.62+.7);cap.textContent=m.name+' · '+(TYPE[m.type]||m.type)+(m.capacity?' · '+m.capacity+' '+m.unit:'');cap.style.display='block'}
 else if(s){selRing.visible=false;cap.textContent=REG[s.id][0];cap.style.display='block'}

function pickAt(cx,cy){const r=cv3.getBoundingClientRect();RC.setFromCamera({x:(cx-r.left)/r.width*2-1,y:-((cy-r.top)/r.height)*2+1},cam);

 const info=h=>{let o=h.object,m=null,rg=null,a=1e9;while(o){const u=o.userData;if(u){if(u.m&&!m)m=typeof u.m=='object'?u.m.id:u.m;if(u.r&&!rg){rg=u.r;a=u.area||1e9}}o=o.parent}return{m,rg,a}};
 const f=info(hits[0]);if(f.m&&MID.has(f.m))return select({k:'m',id:f.m});
 let best=null;for(const h of hits){if(h.distance>hits[0].distance+.6)break;const i=info(h);if(i.m)break;if(i.rg&&(!best||i.a<best.a))best=i}
 select(best?{k:'r',id:best.rg}:null)}

function initMap(){const box=$('#mapbox');
 if(!window.THREE||!THREE.OrbitControls){box.insertAdjacentHTML('afterbegin','<div class="nolib">The 3D map could not load. Check the internet connection and reload.</div>');return}
 try{cv3=$('#cv3')||document.createElement('canvas');cv3.id='cv3';box.insertBefore(cv3,box.firstChild);const ov=document.createElement('div');ov.id='ovl';box.appendChild(ov);

  sc.add(new THREE.HemisphereLight(0xffffff,0x8d9298,.95));const dl=new THREE.DirectionalLight(0xfff6ea,1);dl.position.set(FW/2-20,80,FD/2+60);dl.target.position.set(FW/2,0,FD/2);dl.castShadow=true;dl.shadow.mapSize.set(2048,2048);Object.assign(dl.shadow.camera,{left:-60,right:60,top:44,bottom:-44,near:10,far:220});dl.shadow.camera.updateProjectionMatrix();dl.shadow.bias=-.0004;dl.shadow.normalBias=.04;sc.add(dl,dl.target);

function showPins(list){for(const id in pinEls){const e=pinEls[id],on=list.includes(id);
 if(on){if(e.style.display==='none'){e.style.display='';e.classList.remove('on');requestAnimationFrame(()=>requestAnimationFrame(()=>{e.classList.add('on');need=true}))}}
 else{e.classList.remove('on');e.style.display='none'}}need=true}
function setZones(ids){HZon=ids.length>0;for(const id in HZ){HZ[id].visible=ids.includes(id);HZ[id].material.opacity=.22}need=true}

/* ---------- rendering the slide ---------- */
function count(el){const n=+el.dataset.n,pre=el.dataset.pre,suf=el.dataset.suf,dec=+el.dataset.d||0,comma=el.dataset.c==='1',t0=performance.now(),dur=1300;
 (function f(now){const k=Math.min(1,(now-t0)/dur),v=n*(1-Math.pow(1-k,3));el.textContent=pre+(comma?Math.round(v).toLocaleString('en-US'):v.toFixed(dec))+suf;if(k<1)requestAnimationFrame(f)})(t0)}
function render(i){const s=S[i],card=$('#card');card.classList.remove('in');card.scrollTop=0;
 const cover=(i===0||i===S.length-1);$('#panel').classList.toggle('cover',cover);
 const sl=$('#slide'),SW=sl.clientWidth;if(!B.classList.contains('portrait'))sl.style.setProperty('--pw',Math.round(SW*(cover?.46:.4))+'px');
 card.innerHTML=`<div id="ci"><div class="k rv">${s.k}</div><h1 class="t rv">${s.title}</h1><div class="rule rv"></div>${s.body()}</div>`;
 $('#pgn').textContent=i+1;$('#figcap').innerHTML='<b>FIG. '+(i+1)+'</b>3D view · '+LOC[i];
 card.querySelectorAll('.rv').forEach((e,j)=>e.style.setProperty('--i',j));
 void card.offsetWidth;card.classList.add('in');
 card.querySelectorAll('b[data-n]').forEach(e=>{e.textContent=e.dataset.pre+'0'+e.dataset.suf;setTimeout(()=>count(e),450)});
 $('#cnt').textContent=String(i+1).padStart(2,'0')+' / '+S.length;
 [...$('#seg').children].forEach((e,j)=>{e.className=j<i?'done':j===i?'cur':'';if(j===i&&auto){e.classList.add('run');e.style.setProperty('--dur',(s.dur||20)+'s')}})}

const FS=()=>!!(D.fullscreenElement||D.webkitFullscreenElement);
let busy=false;
function refit(){busy=true;try{dispatchEvent(new Event('resize'))}finally{busy=false}}
function place(){if(idx<0)return;const sl=$('#slide'),p=$('#panel'),c=$('#card'),ci=$('#ci');if(!sl||!p||!c||!ci)return;
 const W=sl.clientWidth,H=sl.clientHeight,em=parseFloat(getComputedStyle(sl).fontSize),g=1.1*em,fh=2.7*em,pw=Math.min(34*em,W*.44),L=idx%2===0,cs=getComputedStyle(c);
 const nh=ci.offsetHeight+parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom),room=H-fh-2*g,h=Math.min(room,nh+4);
 p.style.setProperty('--pwid',pw+'px');p.style.setProperty('--pl',(L?g:W-g-pw)+'px');p.style.setProperty('--pt',(g+(room-h)/2)+'px');p.style.setProperty('--ph',h+'px');
 const tgt=FREE?0:(L?-1:1)*(pw+g)/2,from=window.__vo||0,t0=performance.now();cancelAnimationFrame(window.__voA);
 (function f(n){const k=Math.min(1,(n-t0)/900),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;window.__vo=from+(tgt-from)*e;window.__rs&&window.__rs();if(k<1)window.__voA=requestAnimationFrame(f)})(t0)}
function layout(){const slide=$('#slide'),fs=FS(),aw=innerWidth,ah=innerHeight;B.classList.remove('portrait');B.classList.toggle('fs',fs);
 {const u=Math.max(.42,Math.min(aw/1280,ah/720)).toFixed(3);slide.style.setProperty('--u',u);document.documentElement.style.setProperty('--u',u)}place();refit()}
function go(i){i=Math.max(0,Math.min(S.length-1,i));if(FREE)exitFree();
 const first=idx<0;idx=i;const s=S[i];render(i);place();
 if(GL){setZones(s.zones||[]);showPins(s.pins||[]);FXon=!!s.fx;fxG.visible=FXon;pilotG.visible=!!s.pilot;dimG.visible=!!s.dim;
  const legs=s.legs();
  if(first){const k=legs[0].kfs.shift();ctl.target.copy(k.t);cam.position.copy(k.p);ctl.update()}
  startTour(legs)}
 sched()}
function sched(){clearTimeout(autoT);if(!auto||FREE)return;autoT=setTimeout(()=>{if(idx<S.length-1)go(idx+1);else setAuto(false)},(S[idx].dur||20)*1000)}
function setAuto(on){auto=on;$('#bAuto').innerHTML=on?'❚❚':'▶';$('#bAuto').classList.toggle('on',on);if(!on){clearTimeout(autoT);[...$('#seg').children].forEach(e=>e.classList.remove('run'))}else{const c=$('#seg').children[idx];if(c){c.classList.add('run');c.style.setProperty('--dur',(S[idx].dur||20)+'s')}sched()}}

function enterFree(){FREE=true;cancelAnimationFrame(window.__voA);window.__vo=0;window.__rs&&window.__rs();window.__free=true;tour=null;clearTimeout(autoT);B.classList.add('free');ctl.enabled=true;ctl.minDistance=7;ctl.maxPolarAngle=Math.PI/2-.04;setZones([]);showPins([]);refit();
 $('#hint').textContent='Free look · drag to orbit · scroll to zoom · tap a machine · Esc to return';$('#bFree').classList.add('on');fitAll();need=true}
function exitFree(){FREE=false;window.__free=false;B.classList.remove('free');refit();ctl.enabled=false;ctl.minDistance=1;ctl.maxPolarAngle=Math.PI;fly=null;selRing.visible=false;$('#cap').style.display='none';$('#bFree').classList.remove('on')}
function toggleFree(){if(!GL)return;if(FREE){exitFree();go(idx)}else enterFree()}
function fs(){const d=D,e=d.documentElement;if(!d.fullscreenElement&&!d.webkitFullscreenElement)(e.requestFullscreen||e.webkitRequestFullscreen||function(){}).call(e);else(d.exitFullscreen||d.webkitExitFullscreen||function(){}).call(d)}

/* ---------- boot ---------- */
function initDeck(){const boot=$('#boot');
 if(GL){ctl.minDistance=1;ctl.maxPolarAngle=Math.PI;ctl.enabled=false;PD.lab.forEach(e=>e.style.display='')}
 const box=$('#mapbox'),slide=D.createElement('div');slide.id='slide';B.appendChild(slide);slide.appendChild(box);
 slide.insertAdjacentHTML('beforeend',`<aside id="panel"><div id="card"></div></aside><div id="sfoot"><span class="who2"><b>Abdur Rauf</b><i>|</i>PGD – Garments Business<i>|</i>IBA – University of Dhaka</span><span class="pg">SR-PDS · <b id="pgn">1</b> / ${S.length}</span></div>`);
 box.insertAdjacentHTML('beforeend','<div id="figcap"></div>');
 B.insertAdjacentHTML('beforeend',`<div id="bar"><button id="bPrev" title="Previous (←)" aria-label="Previous slide">‹</button><div id="seg"></div><button id="bNext" title="Next (→)" aria-label="Next slide">›</button><span id="cnt"></span><button id="bAuto" title="Autoplay (P)" aria-label="Autoplay">▶</button><button id="bFree" title="Free look (L)">⌖<span class="lbl"> Free look</span></button><button id="bFs" title="Fullscreen (F)" aria-label="Fullscreen">⛶</button></div>`);
 layout();
 if(GL)buildExtras();
 const seg=$('#seg');S.forEach((s,i)=>{const e=D.createElement('i');e.title=(i+1)+'. '+s.tip;e.onclick=()=>go(i);seg.appendChild(e)});
 $('#bPrev').onclick=()=>go(idx-1);$('#bNext').onclick=()=>go(idx+1);$('#bAuto').onclick=()=>setAuto(!auto);$('#bFree').onclick=toggleFree;$('#bFs').onclick=fs;
 D.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
  if(k==='ArrowRight'||k==='PageDown'||k===' '||k==='Enter'){e.preventDefault();go(idx+1)}
  else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){e.preventDefault();go(idx-1)}
  else if(k==='Home')go(0);else if(k==='End')go(S.length-1);
  else if(k==='f'||k==='F')fs();else if(k==='p'||k==='P')setAuto(!auto);else if(k==='l'||k==='L')toggleFree();
  else if(k==='Escape'&&FREE){exitFree();go(idx)}});
 let sx=null,sy=null;box.addEventListener('touchstart',e=>{if(FREE||e.target.closest('#card,#bar'))return;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
 box.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)go(dx<0?idx+1:idx-1)},{passive:true});
 addEventListener('resize',()=>{if(!busy)layout()});D.addEventListener('fullscreenchange',layout);D.addEventListener('webkitfullscreenchange',layout);let mt=null;D.addEventListener('mousemove',()=>{B.classList.add('showbar');clearTimeout(mt);mt=setTimeout(()=>B.classList.remove('showbar'),2500)});
 go(0);
 if(boot){setTimeout(()=>{boot.style.opacity=0;setTimeout(()=>boot.remove(),900)},500)}}
addEventListener('load',()=>setTimeout(initDeck,0));
})();
